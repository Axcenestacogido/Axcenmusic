services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: axcen-navidrome
    restart: unless-stopped
    ports:
      - "${ND_PORT:-4533}:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: "${ND_SCAN_SCHEDULE:-@every 1h}"
      ND_LOGLEVEL: "${ND_LOG_LEVEL:-info}"
      ND_SESSIONTIMEOUT: "${ND_SESSION_TIMEOUT:-24h}"
      ND_ENABLETRANSCODINGCONFIG: "true"
      ND_DEFAULTTHEME: Dark
      ND_AUTOIMPORTPLAYLISTS: "true"
      ND_LASTFM_ENABLED: "true"
      ND_LASTFM_APIKEY: "6607d97679e26a55be344b35fe0ca1c2"
      ND_LASTFM_SECRET: "a5bf5577ff60e766deb005dcc9db2639"
      ND_LYRICSPRIORITY: "nd-lyrics,lrclib"
    volumes:
      - "${ND_DATA_DIR:-./navidrome-data}:/data"
      - "${MUSIC_DIR:-C:/Music}:/music:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  webqueue:
    build:
      context: ./webqueue
      dockerfile: Dockerfile
    container_name: axcen-webqueue
    restart: unless-stopped
    ports:
      - "${WEBQUEUE_PORT:-8888}:8888"
    environment:
      WEBQUEUE_PORT: "8888"
      MUSIC_DIR: /music
      ND_URL: "http://navidrome:4533"
      ND_ADMIN_USER: "${ND_ADMIN_USER:-}"
      ND_ADMIN_PASS: "${ND_ADMIN_PASS:-}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-500}"
      NTFY_TOPIC: "${NTFY_TOPIC:-}"
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID:-}"
      SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET:-}"
    volumes:
      - "${MUSIC_DIR:-C:/Music}:/music"
    depends_on:
      navidrome:
        condition: service_healthy
    profiles:
      - extras

  music-tag-web:
    image: xhongc/music-tag-web:latest
    container_name: axcen-music-tag
    restart: unless-stopped
    ports:
      - "${MUSIC_TAG_PORT:-6677}:6677"
    volumes:
      - "${MUSIC_DIR:-C:/Music}:/app/media"
      - music-tag-data:/app/data
    profiles:
      - tags

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: axcen-lidarr
    restart: unless-stopped
    ports:
      - "${LIDARR_PORT:-8686}:8686"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - lidarr-config:/config
      - "${MUSIC_DIR:-C:/Music}:/music"
      - "${DOWNLOADS_DIR:-C:/Music/downloads}:/downloads"
    profiles:
      - lidarr

  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: axcen-homarr
    restart: unless-stopped
    ports:
      - "${HOMARR_PORT:-7575}:7575"
    volumes:
      - homarr-config:/app/data/configs
      - homarr-icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - dashboard

  slskd:
    image: slskd/slskd:latest
    container_name: axcen-slskd
    restart: unless-stopped
    ports:
      - "${SLSKD_PORT:-5030}:5030"
      - "2234:2234"
    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
      SLSKD_DOWNLOADS_DIR: /music/soulseek
      SLSKD_SHARED_DIR: /music
      SLSKD_APP_DIR: /app
    volumes:
      - slskd-data:/app
      - "${MUSIC_DIR:-C:/Music}:/music"
    profiles:
      - soulseek

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: axcen-prowlarr
    restart: unless-stopped
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - prowlarr-config:/config
    profiles:
      - lidarr

volumes:
  music-tag-data:
    driver: local
  lidarr-config:
    driver: local
  slskd-data:
    driver: local
  prowlarr-config:
    driver: local
  homarr-config:
    driver: local
  homarr-icons:
    driver: local
