services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "${ND_PORT:-4533}:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: "${ND_SCAN_SCHEDULE:-@every 1h}"
      ND_LOGLEVEL: "${ND_LOG_LEVEL:-info}"
      ND_SESSIONTIMEOUT: "${ND_SESSION_TIMEOUT:-24h}"
      ND_ENABLETRANSCODINGCONFIG: "true"
      ND_DEFAULTTHEME: Dark
      ND_AUTOIMPORTPLAYLISTS: "true"
      ND_LASTFM_ENABLED: "true"
      ND_LASTFM_APIKEY: "6607d97679e26a55be344b35fe0ca1c2"
      ND_LASTFM_SECRET: "a5bf5577ff60e766deb005dcc9db2639"
      ND_LYRICSPRIORITY: "embedded,lrclib"
    volumes:
      - "${ND_DATA_DIR:-./navidrome-data}:/data"
      - "${MUSIC_DIR:-/mnt/music}:/music:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  homepage:
    image: nginx:alpine
    container_name: axcen-homepage
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-7575}:80"
    volumes:
      - "./homepage:/usr/share/nginx/html:ro"

  music-tag-web:
    image: xhongc/music_tag_web:latest
    container_name: axcen-music-tag
    restart: unless-stopped
    ports:
      - "${MUSIC_TAG_PORT:-6677}:8002"
    volumes:
      - "${MUSIC_DIR:-/mnt/music}:/app/media"
      - music-tag-data:/app/data
    profiles:
      - tags

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: axcen-lidarr
    restart: unless-stopped
    ports:
      - "${LIDARR_PORT:-8686}:8686"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - lidarr-config:/config
      - "${MUSIC_DIR:-/mnt/music}:/music"
      - "${DOWNLOADS_DIR:-/mnt/music/downloads}:/downloads"
    profiles:
      - lidarr

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: axcen-prowlarr
    restart: unless-stopped
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - prowlarr-config:/config
    profiles:
      - lidarr

  slskd:
    image: slskd/slskd:latest
    container_name: axcen-slskd
    restart: unless-stopped
    ports:
      - "${SLSKD_PORT:-5030}:5030"
      - "2234:2234"
    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
      SLSKD_DOWNLOADS_DIR: /music/soulseek
      SLSKD_SHARED_DIR: /music
      SLSKD_APP_DIR: /app
    volumes:
      - slskd-data:/app
      - "${MUSIC_DIR:-/mnt/music}:/music"
    profiles:
      - soulseek

volumes:
  music-tag-data:
    driver: local
  lidarr-config:
    driver: local
  prowlarr-config:
    driver: local
  slskd-data:
    driver: local
